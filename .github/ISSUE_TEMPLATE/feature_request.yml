name: ✨ Feature request
description: Suggest a new capability or an improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Aegis is an educational project about **defensive web application engineering**,
        with port scanning as its subject matter. Requests that harden the app, improve the
        documentation, or extend test coverage fit well. Requests that turn it into an
        offensive toolkit — exploitation, evasion, credential attacks — are out of scope.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I have searched existing issues and discussions for this idea.
          required: true
        - label: I have read the scope note above and believe this fits the project.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the limitation you hit, not the solution you have in mind.
      placeholder: >
        Scan history has no way to filter by risk level, so finding past HIGH-risk results
        means scrolling the whole list.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Sketches, API shapes, and mockups all help.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area would this touch?
      options:
        - Scanning / Nmap integration
        - Risk analysis rules
        - Database / persistence
        - API routes
        - Dashboard UI
        - Report export
        - Security hardening
        - Documentation
        - Tests / CI
        - Not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why you set them aside.

  - type: checkboxes
    id: security-impact
    attributes:
      label: Security impact
      description: Tick anything this change would require. These need discussion first.
      options:
        - label: Relaxing target validation in `scanner.py`
        - label: Adding an exception to the Content Security Policy
        - label: Adding a Python or JavaScript dependency
        - label: Adding a scan type more aggressive than TCP connect
        - label: Changing or removing the rate limit
        - label: None of the above

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to open a pull request for this.
